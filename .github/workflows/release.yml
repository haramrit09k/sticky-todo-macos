name: Release

# Publish a downloadable build in either of these ways:
#   - Push a version tag: git tag v1.0.0 && git push origin v1.0.0
#   - Create a release on GitHub's Releases page with a new v* tag
# To (re)attach downloads to an existing release, use "Run workflow" on the
# Actions tab and enter its tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach downloads to (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      ZIP: Session-Todo-macOS.zip
      DMG: Session-Todo-macOS.dmg
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Packaging scripts come from this workflow's commit, so older tags
      # that predate them can still be repackaged.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Build universal app
        run: VERSION="${TAG#v}" ./build.sh --universal

      - name: Package
        run: |
          ditto -c -k --keepParent "outputs/Session Todo.app" "$ZIP"
          release-tools/make-dmg.sh "outputs/Session Todo.app" "$DMG"
          shasum -a 256 "$ZIP" "$DMG" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created on GitHub's website already exists by the time
          # this runs, so attach the files to it instead of creating one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$ZIP" SHA256SUMS.txt --clobber
            exit 0
          fi

          cat > notes.md <<'NOTES'
          Download **Session-Todo-macOS.dmg**, open it, and drag Session Todo into Applications.
          Universal build: runs on Apple Silicon and Intel Macs with macOS 13 or newer.

          This build is not notarized by Apple, so macOS will block it the first time.
          See [Download and install](https://github.com/${{ github.repository }}#download-and-install) for the one-time steps to open it.
          NOTES
          gh release create "$TAG" "$DMG" "$ZIP" SHA256SUMS.txt \
            --title "Session Todo $TAG" \
            --notes-file notes.md \
            --generate-notes
